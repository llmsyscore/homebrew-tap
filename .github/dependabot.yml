# Monthly, grouped action bumps. The github-actions pin in
# .github/actions/setup-brew-ci is immutable, so dependabot is what moves it.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-brew-ci
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
